apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: product-api-alerts
  labels:
    app.kubernetes.io/part-of: product-api
spec:
  groups:
    - name: product-api.availability
      rules:
        - alert: ProductApiUnavailable
          expr: max(up{namespace="product-api-dev",service="product-api"}) == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Product API is unavailable
            description: Prometheus cannot scrape the Product API in product-api-dev for two minutes.
        - alert: ProductApiHigh5xxRate
          expr: sum(rate(http_server_requests_seconds_count{application="product-api",status=~"5.."}[5m])) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Product API 5xx rate is elevated
            description: The Product API has served more than 0.05 HTTP 5xx responses per second for five minutes.
