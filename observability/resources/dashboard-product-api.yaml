apiVersion: v1
kind: ConfigMap
metadata:
  name: product-api-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Product API
data:
  product-api-overview.json: |-
    {
      "title": "Product API — Service Overview",
      "uid": "product-api-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "API availability", "datasource": "Prometheus", "targets": [{"expr": "max(up{namespace=\"product-api-dev\",service=\"product-api\"})", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}, "overrides": []}, "gridPos": {"h": 7, "w": 6, "x": 0, "y": 0}},
        {"id": 2, "type": "timeseries", "title": "P95 request latency", "datasource": "Prometheus", "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"product-api\"}[5m])) by (le))", "legendFormat": "p95", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 7, "w": 9, "x": 6, "y": 0}},
        {"id": 3, "type": "timeseries", "title": "HTTP 5xx error rate", "datasource": "Prometheus", "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{application=\"product-api\",status=~\"5..\"}[5m]))", "legendFormat": "5xx / sec", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 7, "w": 9, "x": 15, "y": 0}},
        {"id": 4, "type": "timeseries", "title": "Container CPU", "datasource": "Prometheus", "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"product-api-dev\",container=\"product-api\"}[5m]))", "legendFormat": "CPU cores", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 7}},
        {"id": 5, "type": "timeseries", "title": "Container memory", "datasource": "Prometheus", "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"product-api-dev\",container=\"product-api\"})", "legendFormat": "memory", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 7}}
      ]
    }
