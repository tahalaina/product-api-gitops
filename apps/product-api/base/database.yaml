apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: product-api-db, key: database}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: product-api-db, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: product-api-db, key: password}}}
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U products']}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: postgres}]}
