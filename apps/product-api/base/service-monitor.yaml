apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-api
  labels:
    app.kubernetes.io/part-of: product-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
