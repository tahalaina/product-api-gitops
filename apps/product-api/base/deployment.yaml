apiVersion: apps/v1
kind: Deployment
metadata: {name: product-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: product-api}}
  template:
    metadata: {labels: {app: product-api}}
    spec:
      containers:
        - name: product-api
          image: product-api
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: DATABASE_URL, value: jdbc:postgresql://postgres:5432/products}
            - {name: DATABASE_USERNAME, valueFrom: {secretKeyRef: {name: product-api-db, key: username}}}
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: product-api-db, key: password}}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: '1', memory: 1Gi}}
