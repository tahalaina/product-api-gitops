apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: product-api-dev, namespace: argocd}
spec:
  project: product-api
  source: {repoURL: https://github.com/tahalaina/product-api-gitops.git, targetRevision: main, path: apps/product-api/overlays/dev}
  destination: {server: https://kubernetes.default.svc, namespace: product-api-dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
